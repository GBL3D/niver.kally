<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário, Kally</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        deepPlum: '#0c0914',
                        warmAmber: '#f59e0b',
                        softGold: '#fcd34d',
                        crimsonGlow: '#9f1239',
                    },
                    animation: {
                        'float-slow': 'floatSlow 5s ease-in-out infinite',
                        'flame-dance': 'flameDance 1.4s ease-in-out infinite alternate',
                        'aura-pulse': 'auraPulse 6s ease-in-out infinite',
                    },
                    keyframes: {
                        floatSlow: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(-2deg)' },
                            '50%': { transform: 'translateY(-6px) rotate(2deg)' },
                        },
                        flameDance: {
                            '0%': { transform: 'scale(1) rotate(-3deg)', opacity: '0.95' },
                            '50%': { transform: 'scale(1.06, 0.96) rotate(2deg)', opacity: '1' },
                            '100%': { transform: 'scale(0.97, 1.05) rotate(-1deg)', opacity: '0.9' },
                        },
                        auraPulse: {
                            '0%, 100%': { opacity: '0.5', transform: 'scale(1)' },
                            '50%': { opacity: '0.85', transform: 'scale(1.08)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0c0914;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Auroras noturnas em dourado quente e vinho/carmesim */
        .bg-aurora {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 50% 10%, rgba(245, 158, 11, 0.14) 0%, transparent 48%),
                radial-gradient(circle at 85% 32%, rgba(159, 18, 57, 0.22) 0%, transparent 46%),
                radial-gradient(circle at 15% 75%, rgba(217, 119, 6, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(136, 19, 55, 0.24) 0%, transparent 55%);
        }

        /* Canvas de faíscas douradas e celebração */
        #celebration-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Cartão principal em vidro escuro sem bordas divisórias */
        .warm-glass {
            background: linear-gradient(160deg, rgba(26, 18, 38, 0.74) 0%, rgba(13, 10, 22, 0.88) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(252, 211, 77, 0.2);
            box-shadow:
                0 28px 65px -15px rgba(0, 0, 0, 0.82),
                0 0 45px -12px rgba(159, 18, 57, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        /* Gradiente dourado intenso para o nome */
        .gold-title {
            background: linear-gradient(135deg, #fffbeb 0%, #fcd34d 45%, #f59e0b 82%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 24px rgba(245, 158, 11, 0.26));
        }

        /* Chamas das velas */
        .flame-glow {
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 16px rgba(245, 158, 11, 0.6));
            transform-origin: center bottom;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Fumaça ao apagar as velas */
        @keyframes smokeRise {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.6);
            }
            25% {
                opacity: 0.75;
            }
            100% {
                opacity: 0;
                transform: translateY(-28px) translateX(6px) scale(1.6);
            }
        }

        .smoke-puff {
            opacity: 0;
            pointer-events: none;
        }

        .candles-blown .smoke-puff {
            animation: smokeRise 2.2s ease-out forwards;
        }

        /* Revelação fluida da nota final */
        .secret-reveal {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transform: translateY(10px);
            transition:
                grid-template-rows 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.65s ease,
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .secret-reveal.is-visible {
            grid-template-rows: 1fr;
            opacity: 1;
            transform: translateY(0);
        }

        .secret-inner {
            overflow: hidden;
        }

        /* Botão principal em dourado e carmesim */
        .btn-celebrate {
            background: linear-gradient(135deg, #d97706 0%, #be123c 100%);
            box-shadow: 0 10px 28px -6px rgba(190, 18, 60, 0.48), 0 4px 14px -2px rgba(217, 119, 6, 0.4);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .btn-celebrate:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 14px 34px -6px rgba(190, 18, 60, 0.62), 0 6px 20px -2px rgba(245, 158, 11, 0.55);
        }

        .btn-celebrate:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-warmAmber/30 selection:text-softGold">

                            <ellipse cx="120" cy="170" rx="80" ry="6.5" fill="rgba(12, 9, 20, 0.65)" />

                            <!-- Andar Inferior -->
                            <rect x="48" y="114" width="144" height="54" rx="14" fill="url(#cakeTierBottom)" stroke="rgba(252, 211, 77, 0.28)" stroke-width="1.4" />
                            <path d="M48 124 C48 117, 54 114, 62 114 L178 114 C186 114, 192 117, 192 124 L192 132 C192 137, 185 137, 185 131 C185 126, 177 126, 177 134 C177 141, 169 141, 169 133 C169 126, 160 126, 160 136 C160 143, 151 143, 151 134 C151 126, 141 126, 141 132 C141 138, 132 138, 132 131 C132 125, 122 125, 122 135 C122 142, 113 142, 113 133 C113 126, 103 126, 103 132 C103 138, 94 138, 94 131 C94 125, 84 125, 84 135 C84 142, 75 142, 75 133 C75 126, 66 126, 66 132 C66 137, 58 137, 58 130 C58 125, 48 127, 48 132 Z" fill="url(#goldGlaze)" opacity="0.9" />

                            <!-- Detalhes dourados na base -->

                            <path d="M68 78 C68 71, 74 68, 82 68 L158 68 C166 68, 172 71, 172 78 L172 84 C172 89, 165 89, 165 83 C165 78, 156 78, 156 86 C156 92, 148 92, 148 84 C148 78, 138 78, 138 87 C138 93, 129 93, 129 85 C129 78, 119 78, 119 84 C119 90, 110 90, 110 83 C110 78, 100 78, 100 86 C100 92, 91 92, 91 84 C91 78, 82 78, 82 84 C82 89, 74 89, 74 83 C74 79, 68 80, 68 84 Z" fill="url(#goldGlaze)" />

                                <rect x="0" y="6" width="8" height="34" rx="3" fill="url(#candleStick)" />
                                <line x1="4" y1="2" x2="4" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
                                <g class="candle-flame flame-glow animate-flame-dance" style="animation-delay: 0.35s;">
                                    <path d="M4 -16 C10 -7, 10 0, 4 2 C-2 0, -2 -7, 4 -16 Z" fill="#f59e0b" />
                                    <path d="M4 -10 C7 -4.5, 7 -0.5, 4 1 C1 -0.5, 1 -4.5, 4 -10 Z" fill="#ffffff" />
                                </g>
                                <path class="smoke-puff" style="animation-delay: 0.15s;" d="M4 0 C8 -7, 1 -14, 5 -22" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" fill="none" />
                            </g>

                            <g transform="translate(144, 34)">
                                <rect x="0" y="6" width="8" height="28" rx="3" fill="url(#candleStick)" />
                                <line x1="4" y1="2" x2="4" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
                                <g class="candle-flame flame-glow animate-flame-dance" style="animation-delay: 0.2s;">
                                    <path d="M4 -14 C9 -6, 9 0, 4 2 C-1 0, -1 -6, 4 -14 Z" fill="#f59e0b" />
                                    <path d="M4 -9 C6.5 -4, 6.5 -0.5, 4 1 C1.5 -0.5, 1.5 -4, 4 -9 Z" fill="#fef08a" />
                                </g>
                                <path class="smoke-puff" style="animation-delay: 0.1s;" d="M4 0 C2 -6, 8 -12, 4 -20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" />

                        </svg>
                    </div>

                    <!-- Botão de Ação -->
                    <button id="blow-candles-btn" type="button" class="btn-celebrate mt-3 inline-flex items-center gap-2.5 px-7 py-3.5 rounded-full text-white font-semibold text-sm sm:text-base tracking-wide cursor-pointer">

                            <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" />
                            <path d="M9.6 4.6A2 2 0 1 1 11 8H2" />
                            <path d="M12.6 19.4A2 2 0 1 0 14 16H2" />
                        </svg>
                        <span id="btn-label">Assoprar as velas</span>
                    </button>

                </div>

                <!-- Nota Final Revelada Após Assoprar as Velas -->
                <div id="special-message-box" class="secret-reveal">
                    <div class="secret-inner">
                        <div class="mt-7 p-6 rounded-2xl bg-gradient-to-br from-amber-500/12 via-rose-900/20 to-transparent border border-softGold/25 text-center space-y-3">
                            
                            <p class="text-slate-100 text-base sm:text-lg leading-relaxed font-medium">
                                Que esse novo ciclo seja <span class="text-softGold font-semibold">len (espera um pouco) dário</span>. Aproveita muito o seu dia!
                            </p>

                            <div class="pt-1">
                                <span class="font-serif italic text-xl sm:text-2xl text-softGold">
                                    — Biel
                                </span>
                            </div>

                        </div>
                    </div>
                </div>

            </section>

        </div>
    </main>

    <script>
        /**
         * Faíscas douradas ambientes (estilo varinha) + Explosão de celebração ao assoprar as velas
         */
        const canvas = document.getElementById('celebration-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const ambientSparks = Array.from({ length: 55 }, () => createAmbientSpark());

        function createAmbientSpark() {
            const colors = ['#fcd34d', '#f59e0b', '#fb7185', '#fef3c7'];
            return {
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.9 + 0.6,
                vx: (Math.random() - 0.5) * 0.28,
                vy: -Math.random() * 0.35 - 0.08,
                alpha: Math.random() * 0.65 + 0.15,
                pulseSpeed: (Math.random() * 0.015 + 0.005) * (Math.random() > 0.5 ? 1 : -1),
                color: colors[Math.floor(Math.random() * colors.length)]
            };
        }

        let celebrationParticles = [];

        function triggerCelebrationBurst() {
            const palette = ['#fcd34d', '#f59e0b', '#fbbf24', '#fb7185', '#be123c', '#ffffff'];
            const origins = [
                { x: width * 0.5, y: height * 0.52 },
                { x: width * 0.28, y: height * 0.44 },
                { x: width * 0.72, y: height * 0.44 }
            ];

            origins.forEach((origin, idx) => {
                setTimeout(() => {
                    for (let i = 0; i < 65; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const velocity = Math.random() * 8 + 2.5;
                        const isConfetti = Math.random() > 0.45;

                        celebrationParticles.push({
                            x: origin.x,
                            y: origin.y,
                            vx: Math.cos(angle) * velocity,
                            vy: Math.sin(angle) * velocity - 3.5,
                            gravity: 0.14,
                            drag: 0.97,
                            size: isConfetti ? Math.random() * 6 + 4 : Math.random() * 3 + 1.5,
                            isConfetti,
                            rotation: Math.random() * 360,
                            rotationSpeed: (Math.random() - 0.5) * 10,
                            alpha: 1,
                            decay: Math.random() * 0.008 + 0.006,
                            color: palette[Math.floor(Math.random() * palette.length)]
                        });
                    }
                }, idx * 180);
            });
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            for (const s of ambientSparks) {
                s.x += s.vx;
                s.y += s.vy;
                s.alpha += s.pulseSpeed;

                if (s.alpha <= 0.12 || s.alpha >= 0.85) {
                    s.pulseSpeed *= -1;
                }

                if (s.y < -10) {
                    s.y = height + 10;
                    s.x = Math.random() * width;
                }
                if (s.x < -10) s.x = width + 10;
                if (s.x > width + 10) s.x = -10;

                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = s.color;
                ctx.fill();
                ctx.restore();
            }

            for (let i = celebrationParticles.length - 1; i >= 0; i--) {
                const p = celebrationParticles[i];
                p.vx *= p.drag;
                p.vy *= p.drag;
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    celebrationParticles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;

                if (p.isConfetti) {
                    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                }

                ctx.restore();
            }

            requestAnimationFrame(animateCanvas);
        }

        window.onload = function () {
            animateCanvas();

            const cakeWrapper = document.getElementById('cake-wrapper');
            const cakeGlow = document.getElementById('cake-glow');
            const blowBtn = document.getElementById('blow-candles-btn');
            const btnLabel = document.getElementById('btn-label');
            const btnIcon = document.getElementById('btn-icon');
            const flames = document.querySelectorAll('.candle-flame');
            const secretBox = document.getElementById('special-message-box');

            let candlesBlown = false;

            function handleBlowCandles() {
                if (!candlesBlown) {
                    candlesBlown = true;

                    flames.forEach(flame => {
                        flame.style.opacity = '0';
                        flame.style.transform = 'scale(0.2)';
                    });

                    cakeWrapper.classList.add('candles-blown');
                    cakeGlow.style.opacity = '0.25';

                    triggerCelebrationBurst();
                    secretBox.classList.add('is-visible');

                    btnLabel.textContent = 'Faíscas e confetes';
                    btnIcon.innerHTML = '<path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/>';
                } else {
                    triggerCelebrationBurst();
                }
            }

            blowBtn.addEventListener('click', handleBlowCandles);
            cakeWrapper.addEventListener('click', handleBlowCandles);
        };
    </script>
</body>
